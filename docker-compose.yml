services:
  mysql:
    image: mysql:8.4
    container_name: fattoria_mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: fattoria_db
      MYSQL_USER: fattoria_user
      MYSQL_PASSWORD: fattoria_pass
    ports:
      - "3306:3306"
    volumes:
      - fattoria_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fattoria_user", "-pfattoria_pass"]
      interval: 5s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: fattoria_phpmyadmin_dev
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  fattoria_mysql_data:
    driver: local
